name: DMIT stock monitor
run-name: DMIT ${{ github.event.inputs.mode || 'check' }}

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'initialize: once; telegram-test: channel only; check: official inventory'
        type: choice
        options: [check, initialize, telegram-test]
        default: check
      force:
        description: Ignore backoff for this manual diagnosis
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dmit-official-monitor
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write # Compare-and-swap state.json on monitor-state only in application code.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify safety regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Check official inventory or perform explicit setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MONITOR_MODE: ${{ github.event.inputs.mode || 'check' }}
          MONITOR_FORCE: ${{ github.event.inputs.force || 'false' }}
        shell: bash
        run: |
          args=(--mode "$MONITOR_MODE")
          if [[ "$MONITOR_FORCE" == 'true' ]]; then args+=(--force); fi
          python3 -m dmit_monitor "${args[@]}"
